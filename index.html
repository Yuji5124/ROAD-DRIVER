<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07111c" />
    <meta name="description" content="道路を左右に動かし、自動走行する車を守る3Dゲーム ROAD DRIVER" />
    <title>ROAD DRIVER</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="ROAD DRIVER 3Dゲーム"></canvas>
      <div class="vignette"></div>
      <header class="topbar">
        <a class="brand" href="#" aria-label="ROAD DRIVER"><span class="brand-mark">R</span><span>ROAD<br /><b>DRIVER</b></span></a>
        <div class="stage-chip"><i></i><span id="stage-label">CITY</span></div>
        <button id="pause-button" class="icon-button" aria-label="一時停止" title="一時停止">Ⅱ</button>
      </header>

      <section class="hud" aria-live="polite">
        <div class="timer"><span class="eyebrow">SURVIVE</span><strong id="timer">60</strong><span class="seconds">SEC</span></div>
        <div class="progress"><div id="progress-fill"></div><div class="stage-markers"><i></i><i></i></div></div>
        <div class="near-miss"><span class="pulse-dot"></span><span class="eyebrow">NEAR MISS</span><strong id="near-misses">00</strong></div>
      </section>

      <div id="toast" class="toast" aria-live="polite"></div>
      <div id="drop-warning" class="drop-warning"><span>!</span>ROAD EDGE</div>

      <div class="controls" aria-label="道路操作">
        <button class="drive-button" data-direction="-1" aria-label="道路を左へ移動"><span>←</span><small>LEFT</small></button>
        <div class="control-hint"><span class="keycap">A</span><span class="keycap">D</span><span>ROAD SHIFT</span></div>
        <button class="drive-button" data-direction="1" aria-label="道路を右へ移動"><span>→</span><small>RIGHT</small></button>
      </div>

      <section id="overlay" class="overlay">
        <div class="overlay-card">
          <div class="eyebrow accent" id="overlay-kicker">A DIFFERENT KIND OF DRIVE</div>
          <h1 id="overlay-title">道路を、<em>運転しろ。</em></h1>
          <p id="overlay-copy">車は自動で走り続ける。<br />道路を左右に動かして、落下から守ろう。</p>
          <div class="car-picker" id="car-picker"><span>SELECT YOUR RIDE</span><div>
            <button class="car-option selected" data-car="sport">01 <b>VOLT</b></button>
            <button class="car-option" data-car="classic">02 <b>CLASSIC</b></button>
            <button class="car-option" data-car="neo">03 <b>NEO</b></button>
          </div></div>
          <button id="start-button" class="primary-button"><span>ゲームスタート</span><b>→</b></button>
          <div class="start-hint">A / D または ← / →　・　iPadは画面ボタン</div>
        </div>
        <div class="overlay-orbit orbit-one"></div><div class="overlay-orbit orbit-two"></div>
      </section>

      <footer class="footer"><span>ROAD SHIFTING SIMULATOR</span><span id="telemetry">— FPS&nbsp; · &nbsp;— DRAWS&nbsp; · &nbsp;— TRIANGLES</span></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
